<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeakLandings | Premier Properties</title>
<meta name="description" content="PeakLandings - Premier Properties. Real estate investment and short and long term rentals.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest: #345A3E;
    --brass: #C49E48;
    --charcoal: #454545;
    --cream: #F9F7ED;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--cream);
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
  }
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* subtle background mountain silhouette */
  .bg-motif{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }

  .content{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:6vh 6vw;
    opacity:0;
    transform:translateY(10px);
    animation:riseIn 1.1s ease-out forwards;
    animation-delay:.15s;
  }

  @keyframes riseIn{
    to{opacity:1; transform:translateY(0);}
  }

  .logo{
    width:min(440px, 78vw);
    height:auto;
    margin-bottom:clamp(10px, 2vh, 20px);
  }

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  .rule{
    width:64px;
    height:2px;
    background:var(--brass);
    border:none;
    margin:clamp(16px, 2.6vh, 24px) 0;
  }

  .tagline{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:clamp(0.72rem, 1.6vw, 0.95rem);
    letter-spacing:0.32em;
    color:var(--brass);
    text-transform:uppercase;
    margin:0;
  }

  footer{
    position:absolute;
    bottom:28px;
    left:0;
    right:0;
    text-align:center;
    z-index:1;
    font-family:'Poppins', sans-serif;
    font-size:0.72rem;
    letter-spacing:0.08em;
    color:var(--charcoal);
    opacity:0.45;
  }

  @media (max-width:480px){
    footer{bottom:18px; font-size:0.65rem;}
  }
  @media (prefers-reduced-motion: reduce){
    .content{animation:none;opacity:1;transform:none;}
  }
</style>
</head>
<body>

  <svg class="bg-motif" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0,900 L0,770 C150,700 250,590 330,560 C400,535 440,640 520,665 C600,690 660,560 740,470 C790,418 830,430 880,480 C950,550 1000,660 1090,655 C1180,650 1230,560 1290,535 C1380,500 1500,640 1600,760 L1600,900 Z" fill="#345A3E" opacity="0.05"/>
    <path d="M0,900 L0,830 C140,790 260,700 380,690 C500,680 560,790 680,780 C790,770 840,610 930,590 C1030,568 1090,760 1200,745 C1300,730 1380,660 1470,690 C1530,710 1570,780 1600,820 L1600,900 Z" fill="#454545" opacity="0.045"/>
  </svg>

  <div class="content">
    <img class="logo" src="logo.svg" alt="PeakLandings mountain mark and script wordmark">
    <h1 class="sr">PeakLandings</h1>
    <hr class="rule">
    <p class="tagline">Premier Properties</p>
  </div>

  <footer>&copy; 2026 PeakLandings</footer>

</body>
</html>
